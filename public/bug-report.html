<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report a bug — Arithmetic Racer</title>
  <meta name="description" content="Report a bug in Arithmetic Racer." />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>" />
  <link rel="stylesheet" href="style-a.css" />
  <style>
    .doc {
      max-width: 34rem;
      margin: 1.5rem auto 3rem;
      padding: 1.75rem clamp(1rem, 4vw, 2.25rem);
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--card-shadow);
      color: var(--navy-soft);
      line-height: 1.6;
    }
    .doc h1 { color: var(--navy); margin: 0 0 0.5rem; }
    .doc a { color: var(--car-blue); }
    .doc .back { display: inline-block; margin-bottom: 1rem; color: var(--car-blue); }
    .doc label { display: block; margin: 1.1rem 0 0.3rem; color: var(--navy); font-weight: 600; font-size: 0.95rem; }
    .doc .hint { font-weight: 400; color: var(--navy-mute); font-size: 0.85rem; }
    .doc input[type="email"],
    .doc input[type="text"],
    .doc textarea {
      width: 100%;
      padding: 0.6rem 0.7rem;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      font: inherit;
      font-size: 1rem;
      color: var(--navy-soft);
      background: #fff;
    }
    .doc textarea { min-height: 5.5rem; resize: vertical; }
    .doc button {
      margin-top: 1.2rem;
      width: 100%;
      padding: 0.75rem 1rem;
      font: inherit;
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
      background: var(--green);
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .doc button:hover:not(:disabled) { background: var(--green-hover); }
    .doc button:disabled { opacity: 0.6; cursor: default; }
    .form-note {
      margin: 1rem 0 0;
      padding: 0.7rem 0.85rem;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }
    .form-note.error { display: block; background: #fdecea; color: #a3231a; }
    .form-note.ok { display: block; background: #eaf7ea; color: #2f6d2f; }
  </style>
</head>
<body>
  <main class="doc">
    <a class="back" href="/">&larr; Back to Arithmetic Racer</a>
    <h1>Report a bug</h1>
    <p>
      Something broken, wrong, or stuck? Tell us what happened. For anything
      else — a question, feedback, or deleting your data — use the
      <a href="/contact">contact form</a>.
    </p>

    <form id="bug-form" novalidate>
      <label for="what-happened">What went wrong?</label>
      <textarea id="what-happened" name="what_happened" maxlength="1500" required
        placeholder="The race froze on the third problem and my car stopped moving."></textarea>

      <label for="expected">What did you expect to happen?</label>
      <textarea id="expected" name="expected" maxlength="1500" required
        placeholder="The next problem should have appeared after I pressed Enter."></textarea>

      <label for="where">
        Where in the app did this happen?
        <span class="hint">— optional, and worth more than any detail we can detect</span>
      </label>
      <input type="text" id="where" name="where" maxlength="200"
        placeholder="A Quickplay race on hard" />

      <label for="steps">
        Steps to reproduce
        <span class="hint">— optional, but it makes a bug far easier to fix</span>
      </label>
      <textarea id="steps" name="steps" maxlength="1500"
        placeholder="1. Start a Quickplay race on hard&#10;2. Answer two problems&#10;3. …"></textarea>

      <label for="email">
        Your email
        <span class="hint">— optional, only if you want a reply</span>
      </label>
      <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" />

      <button type="submit" id="submit-btn">Send bug report</button>
      <p class="form-note" id="form-note" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script type="module">
    import { collectBugPayload } from "/src/bug-report-context.js";

    const form = document.getElementById("bug-form");
    const note = document.getElementById("form-note");
    const btn = document.getElementById("submit-btn");

    function show(kindClass, text) {
      note.className = `form-note ${kindClass}`;
      note.textContent = text;
    }

    const value = (id) => document.getElementById(id).value.trim();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const whatHappened = value("what-happened");
      const expected = value("expected");
      if (!whatHappened) return show("error", "Please describe what went wrong.");
      if (!expected) return show("error", "Please say what you expected to happen instead.");

      btn.disabled = true;
      show("", "");
      try {
        const res = await fetch("/api/contact", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            kind: "bug",
            what_happened: whatHappened,
            expected,
            where: value("where") || undefined,
            steps: value("steps") || undefined,
            email: value("email") || undefined,
            ...collectBugPayload(window),
          }),
        });
        if (res.status === 429) {
          show("error", "That's a few reports in a short time — please try again later.");
          return;
        }
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          const reason = {
            empty_what_happened: "Please describe what went wrong.",
            empty_expected: "Please say what you expected to happen instead.",
            field_too_long: "That's a bit long — please shorten it.",
            message_too_long: "That's a bit long — please shorten it.",
            invalid_email: "That email address doesn't look right.",
          }[body.error];
          show("error", reason ?? "Something went wrong sending that. Please try again.");
          return;
        }
        form.reset();
        show("ok", "Thanks — your bug report was received.");
      } catch {
        show("error", "Couldn't reach the server. Please check your connection and try again.");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
